<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Mô hình Quản lý Học tập FIT@HCMUS</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-brand">
            <div class="logo-hcmus">
                <span class="logo-hcm">HCM</span>
                <span class="logo-us">US</span>
            </div>
            <div class="logo-text">
                <div class="brand-title">fit@hcmus</div>
                <div class="brand-subtitle">Khoa Công nghệ thông tin</div>
            </div>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-item">Đăng nhập</a>
            <span class="nav-divider">|</span>
            <a href="register.html" class="nav-item active">Đăng ký</a>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Content Banner Header -->
        <div class="header-titles">
            <h3 class="sub-heading">Trường Đại học Khoa học Tự nhiên, ĐHQG - TPHCM</h3>
            <h1 class="main-heading">MÔ HÌNH QUẢN LÍ HỌC TẬP</h1>
            <p class="major-info">Ngành: Khoa học máy tính</p>
        </div>

        <!-- Register Form Card -->
        <div class="login-card">
            <h2 class="card-title">Đăng ký</h2>
            
            <form class="login-form">
                <div class="form-group">
                    <label for="fullname" class="form-label">Họ và tên:</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="fullname" class="form-control" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="student-id" class="form-label">Mã số sinh viên:</label>
                    <div class="input-wrapper input-wrapper-medium">
                        <span class="input-icon text-icon">ID</span>
                        <input type="text" id="student-id" class="form-control" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mật khẩu:</label>
                    <div class="input-wrapper input-wrapper-medium">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="form-label">Xác nhận mật khẩu:</label>
                    <div class="input-wrapper input-wrapper-medium">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="confirm-password" class="form-control">
                    </div>
                </div>

                <div class="form-actions register-actions">
                    <button type="button" class="btn-submit" onclick="registerUser()">Đăng ký</button>
                </div>

                <div class="divider"></div>

                <div class="register-prompt">
                    Đã có tài khoản? <a href="index.html" class="register-link">Đăng nhập ngay.</a>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
