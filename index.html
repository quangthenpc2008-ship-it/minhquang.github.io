<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô hình Quản lý Học tập - FIT@HCMUS</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-brand">
            <div class="logo-hcmus">
                <span class="logo-hcm">HCM</span>
                <span class="logo-us">US</span>
            </div>
            <div class="logo-text">
                <div class="brand-title">fit@hcmus</div>
                <div class="brand-subtitle">Khoa Công nghệ thông tin</div>
            </div>
        </div>
        <div class="nav-links">
            <a href="#" class="nav-item">Đăng nhập</a>
            <span class="nav-divider">|</span>
            <a href="register.html" class="nav-item">Đăng ký</a>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Content Banner Header -->
        <div class="header-titles">
            <h3 class="sub-heading">Trường Đại học Khoa học Tự nhiên, ĐHQG - TPHCM</h3>
            <h1 class="main-heading">MÔ HÌNH QUẢN LÍ HỌC TẬP</h1>
            <p class="major-info">Ngành: Khoa học máy tính</p>
        </div>

        <!-- Login Form Card -->
        <div class="login-card">
            <h2 class="card-title">Đăng nhập</h2>
            
            <form class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">Tên đăng nhập:</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="username" class="form-control" placeholder="" autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mật khẩu:</label>
                    <div class="input-wrapper input-wrapper-short">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" class="form-control" placeholder="">
                    </div>
                </div>

                <div class="form-actions">
                    <a href="#" class="forgot-link">Quên mật khẩu?</a>
                    <button type="button" class="btn-submit" onclick="loginUser()">Đăng nhập</button>
                </div>

                <div class="divider"></div>

                <div class="register-prompt">
                    Chưa có tài khoản? <a href="register.html" class="register-link">Đăng ký ngay.</a>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
